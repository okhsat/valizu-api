services:
  api:
    extends:
      file: docker-compose.yml
      service: api

  nginx:
    extends:
      file: docker-compose.yml
      service: nginx
    volumes:
      - ./nginx/vps.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    ports: !reset []
